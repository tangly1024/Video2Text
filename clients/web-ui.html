<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video2Text</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #607080;
      --line: #d9e0e7;
      --accent: #0f766e;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 18px 24px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(320px, 1fr);
      gap: 18px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    input, select, button, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }
    input[type="file"] { padding: 8px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      margin-top: 14px;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .status {
      min-height: 24px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }
    .status.error { color: var(--danger); }
    textarea {
      min-height: 390px;
      resize: vertical;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    code {
      display: block;
      overflow-x: auto;
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; padding: 12px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Video2Text</h1>
  </header>
  <main>
    <section>
      <form id="form">
        <label for="media">音频或视频文件</label>
        <input id="media" name="media" type="file" accept=".wav,.mp3,.m4a,.mp4,.flv,audio/*,video/*" />

        <div class="grid">
          <div>
            <label for="language">识别语言</label>
            <input id="language" name="language" value="zh-CN" />
          </div>
          <div>
            <label for="output">输出目录</label>
            <input id="output" name="output" value="output" />
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="segmentLength">分段秒数</label>
            <input id="segmentLength" name="segmentLength" type="number" min="1" value="30" />
          </div>
          <div>
            <label for="workers">并发数</label>
            <input id="workers" name="workers" type="number" min="1" value="5" />
          </div>
        </div>

        <button id="run" type="submit">开始转写</button>
        <div id="status" class="status">本地打开 HTML 时可预览命令；通过 Python 或 Node 服务打开时可直接运行。</div>
      </form>

      <label>等价 CLI</label>
      <code id="command">video2text 文件路径 -o output --language zh-CN --segment-length 30 --workers 5</code>
    </section>

    <section>
      <label for="result">转写结果</label>
      <textarea id="result" readonly placeholder="完成后会显示 UTF-8 文本"></textarea>
    </section>
  </main>

  <script>
    const form = document.querySelector("#form");
    const fileInput = document.querySelector("#media");
    const language = document.querySelector("#language");
    const output = document.querySelector("#output");
    const segmentLength = document.querySelector("#segmentLength");
    const workers = document.querySelector("#workers");
    const command = document.querySelector("#command");
    const statusBox = document.querySelector("#status");
    const result = document.querySelector("#result");
    const run = document.querySelector("#run");

    function updateCommand() {
      const name = fileInput.files[0]?.name || "文件路径";
      command.textContent = `video2text ${name} -o ${output.value || "output"} --language ${language.value || "zh-CN"} --segment-length ${segmentLength.value || "30"} --workers ${workers.value || "5"}`;
    }

    [fileInput, language, output, segmentLength, workers].forEach((field) => {
      field.addEventListener("input", updateCommand);
      field.addEventListener("change", updateCommand);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "status";
      result.value = "";
      if (location.protocol === "file:") {
        statusBox.textContent = "本地 HTML 不能直接调用 Python。请运行 python -m video_converter.web_ui 或 node clients/node-server.js。";
        return;
      }
      if (!fileInput.files.length) {
        statusBox.textContent = "请选择文件。";
        statusBox.className = "status error";
        return;
      }
      run.disabled = true;
      statusBox.textContent = "转写中...";
      try {
        const response = await fetch("/api/convert", {
          method: "POST",
          body: new FormData(form),
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || "转写失败");
        }
        result.value = payload.text || "";
        statusBox.textContent = `已写入 ${payload.path}`;
      } catch (error) {
        statusBox.textContent = error.message;
        statusBox.className = "status error";
      } finally {
        run.disabled = false;
      }
    });
  </script>
</body>
</html>
